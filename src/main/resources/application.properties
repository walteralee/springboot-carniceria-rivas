# ===============================
# APLICACIÓN
# ===============================

spring.application.name=carniceria-rivas

# Abre el navegador al arrancar (lo activan el .exe de Windows y run.bat / run.sh)
carniceria.abrir-navegador=false

# ===============================
# BASE DE DATOS (SQLite)
# ===============================

# El archivo se crea solo en la carpeta "datos" (ver config/CarpetaDeDatos.java)
spring.datasource.url=jdbc:sqlite:${carniceria.datos:datos}/carniceria_rivas.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite solo admite una escritura a la vez: una única conexión evita errores de "database is locked"
spring.datasource.hikari.maximum-pool-size=1

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===============================
# SERVIDOR
# ===============================

server.port=8080

# Swagger: documentación de la API en /swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
